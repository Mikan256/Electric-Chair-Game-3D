<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flaxia Local Harness — 電気イスゲーム 3D</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #06060a;
        --panel: #101018;
        --line: #262636;
        --red: #ff2442;
        --green: #21e08a;
        --muted: #8d8a9c;
        --text: #f0ebf2;
        font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', Meiryo, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        padding: 8px 14px;
        border-bottom: 1px solid var(--line);
        background: #0a0a10;
        font-size: 12px;
      }
      header h1 {
        font-size: 13px;
        margin: 0;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      header .room {
        color: var(--green);
        font-family: ui-monospace, monospace;
      }
      header .status {
        color: var(--muted);
      }
      header .spacer {
        flex: 1;
      }
      button {
        border: 1px solid #3b3b52;
        background: #14141f;
        color: var(--text);
        font-size: 11px;
        padding: 5px 10px;
        cursor: pointer;
        border-radius: 3px;
      }
      button:hover {
        border-color: var(--red);
      }
      button.primary {
        border-color: var(--green);
        color: #bfffe0;
      }
      .room-join {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .room-join input {
        width: 104px;
        padding: 4px 7px;
        border: 1px solid #3b3b52;
        border-radius: 3px;
        background: #14141f;
        color: var(--text);
        font:
          11px/1.4 ui-monospace,
          monospace;
        text-transform: uppercase;
      }
      .room-join input:focus {
        outline: 1px solid var(--green);
        outline-offset: 1px;
      }
      #room-error {
        color: #ff8798;
        font-size: 11px;
        max-width: 260px;
      }
      #room-error[hidden] {
        display: none;
      }
      main {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      .pane {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        border-right: 1px solid var(--line);
      }
      .pane:last-child {
        border-right: 0;
      }
      .pane .label {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 10px;
        font-size: 11px;
        color: var(--muted);
        background: #0a0a10;
        border-bottom: 1px solid var(--line);
      }
      .pane .label b {
        color: var(--text);
      }
      .pane iframe {
        flex: 1;
        width: 100%;
        border: 0;
        background: #000;
      }
      #log {
        height: 74px;
        overflow: auto;
        padding: 4px 10px;
        border-top: 1px solid var(--line);
        background: #07070c;
        font:
          10px/1.55 ui-monospace,
          monospace;
        color: #8b8b9d;
      }
      #log .host {
        color: #ff9cac;
      }
      #log .peer {
        color: #7bffbe;
      }
      @media (max-width: 800px) {
        main {
          flex-direction: column;
        }
        .pane {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Flaxia Local Harness</h1>
      <span>room <span class="room" id="room-id">LOCAL</span></span>
      <span class="status" id="status">waiting</span>
      <span class="status" id="players">0 / 2</span>
      <span class="spacer"></span>
      <span class="room-join">
        <input
          id="room-input"
          type="text"
          maxlength="16"
          placeholder="ROOM ID"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
          aria-label="ルームID"
        />
        <button id="room-join">B 参加</button>
        <button id="room-create">A 新規ルーム</button>
      </span>
      <span id="room-error" role="alert" hidden></span>
      <button id="force-ready">両者READY</button>
      <button class="primary" id="force-start">試合開始</button>
      <button id="reload">リロード</button>
    </header>
    <main>
      <section class="pane">
        <div class="label"><b>PLAYER A</b><span>Alice</span></div>
        <iframe
          id="frame-a"
          title="Player A"
          src="/index.html?embed=1&mode=online&name=Alice"
        ></iframe>
      </section>
      <section class="pane">
        <div class="label"><b>PLAYER B</b><span>Bob</span></div>
        <iframe
          id="frame-b"
          title="Player B"
          src="/index.html?embed=1&mode=online&name=Bob"
        ></iframe>
      </section>
    </main>
    <div id="log"></div>
    <script type="module" src="/dev/harness.ts"></script>
  </body>
</html>
